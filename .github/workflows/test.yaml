name: Test
on:
  workflow_call:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: netlog-viewer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Dockerfile vulnerabilities using Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@56271af6e62b69aab5fe223bf71d8de46f391431 # master
        with:
          directory: .
          framework: dockerfile
          quiet: true # show only failed checks
          container_user: 1000 # UID to run the container under to prevent permission issues
